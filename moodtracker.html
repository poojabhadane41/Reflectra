<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflectra • Voice Mood Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 { 
            font-size: 32px; 
            font-weight: 700;
            background: linear-gradient(135deg, #7ac18d, #4ec487);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        /* 🎤 VOICE MODAL */
        .voice-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0; visibility: hidden;
            transition: all 0.4s ease;
        }

        .voice-modal.show { opacity: 1; visibility: visible; }

        .voice-panel {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(25px);
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            text-align: center;
            transform: scale(0.7) translateY(50px);
            transition: all 0.4s ease;
        }

        .voice-modal.show .voice-panel { transform: scale(1) translateY(0); }

        .voice-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .voice-title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            flex: 1;
            margin-left: 15px;
        }

        .close-btn {
            background: rgba(100,116,139,0.2);
            border: none;
            width: 45px; height: 45px;
            border-radius: 50%;
            color: #64748b;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover { background: rgba(100,116,139,0.4); color: #1e293b; }

        /* States */
        .voice-state { display: none; padding: 20px 0; }
        .voice-state.active { display: block; }

        .mic-large { font-size: 70px; display: block; margin: 0 auto 25px; }

        .record-btn, .stop-btn, .save-btn {
            border: none;
            padding: 18px 40px;
            border-radius: 35px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 160px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        .record-btn {
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
            color: white;
        }

        .record-btn:hover { transform: translateY(-3px); box-shadow: 0 18px 40px rgba(255,107,107,0.4); }

        .stop-btn {
            background: linear-gradient(135deg, #ef4444, #f87171);
            color: white;
        }

        .stop-btn:hover { transform: translateY(-3px); box-shadow: 0 18px 40px rgba(239,68,68,0.4); }

        .save-btn {
            background: linear-gradient(135deg, #7ac18d, #4ec487);
            color: white;
        }

        .save-btn:hover { transform: translateY(-3px); box-shadow: 0 18px 40px rgba(122,193,141,0.4); }

        .spinner {
            width: 50px; height: 50px;
            border: 4px solid #f0f0f0;
            border-top: 4px solid #4ecdc4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .emotion-result {
            margin: 30px 0;
            padding: 25px;
            background: rgba(122,193,141,0.1);
            border-radius: 20px;
            border-left: 5px solid #7ac18d;
        }

        .emotion-emoji { font-size: 64px; margin-bottom: 15px; animation: bounce 0.6s ease; }
        @keyframes bounce { 0%,20%,50%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-15px); } 60% { transform: translateY(-8px); } }

        .emotion-name { font-size: 26px; font-weight: 700; margin-bottom: 15px; }
        .suggestion { font-size: 16px; color: #1e293b; line-height: 1.5; }

        .status-text { font-size: 18px; color: #64748b; margin-bottom: 25px; }

        @media (max-width: 480px) {
            .app-container { margin: 10px; padding: 30px 20px; }
            .voice-panel { padding: 30px 20px; }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <h1><i class="fas fa-heart"></i> Voice Mood</h1>
        <p style="color: #64748b; margin-bottom: 40px;">Speak naturally - we'll detect your emotion ✨</p>
        
        <button class="record-btn large-btn" onclick="openVoiceRecorder()">
            <i class="fas fa-microphone"></i><br>Start Voice Entry
        </button>
    </div>

    <!-- 🎤 VOICE RECORDER MODAL -->
    <div class="voice-modal" id="voiceRecorder">
        <div class="voice-panel">
            <div class="voice-header">
                <i class="fas fa-microphone-alt" style="font-size: 28px; color: #667eea;"></i>
                <h2 class="voice-title">Speak Your Feelings</h2>
                <button class="close-btn" onclick="closeVoiceRecorder()">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- 1. READY STATE -->
            <div id="readyState" class="voice-state active">
                <div class="mic-large">🎙️</div>
                <div class="status-text">Ready to listen</div>
                <button class="record-btn" onclick="startRecording()">
                    <i class="fas fa-circle"></i> Hold to Record
                </button>
                <p style="color: #9ca3af; font-size: 14px; margin-top: 15px;">
                    Speak for 3-5 seconds
                </p>
            </div>

            <!-- 2. RECORDING STATE -->
            <div id="recordingState" class="voice-state">
                <div class="mic-large" id="pulseMic">🔴</div>
                <div class="status-text" style="color: #ef4444;">Recording... Release to stop</div>
                <button class="stop-btn" onclick="stopRecording()">
                    <i class="fas fa-stop"></i> Stop
                </button>
            </div>

            <!-- 3. PROCESSING STATE -->
            <div id="processingState" class="voice-state">
                <div class="spinner"></div>
                <div class="status-text">🔮 Detecting emotion...</div>
            </div>

            <!-- 4. RESULT STATE -->
            <div id="resultState" class="voice-state">
                <div class="emotion-result">
                    <div id="emotionEmoji" class="emotion-emoji"></div>
                    <div id="emotionName" class="emotion-name"></div>
                </div>
                <div id="suggestionText" class="suggestion"></div>
                <button class="save-btn" onclick="saveMood()">
                    <i class="fas fa-save"></i> Save to Diary
                </button>
            </div>
        </div>
    </div>

    <script>
        // 🎤 GLOBAL VARIABLES
        let mediaRecorder = null;
        let audioChunks = [];
        let stream = null;
        let isRecording = false;

        // 🎯 MOOD STORAGE
        if (!localStorage.getItem("moods")) {
            localStorage.setItem("moods", JSON.stringify([]));
        }

        // 🚀 MAIN FUNCTIONS
        function openVoiceRecorder() {
            document.getElementById('voiceRecorder').classList.add('show');
            showState('ready');
        }

        function closeVoiceRecorder() {
            document.getElementById('voiceRecorder').classList.remove('show');
            resetRecorder();
        }

        function showState(stateName) {
            document.querySelectorAll('.voice-state').forEach(state => {
                state.classList.remove('active');
            });
            document.getElementById(stateName + 'State').classList.add('active');
        }

        // 🎤 RECORDING FUNCTIONS
        async function startRecording() {
            try {
                showState('recording');
                startPulseEffect();

                stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true
                    }
                });

                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.start(100);
                isRecording = true;

            } catch (err) {
                console.error('Mic error:', err);
                showError('Microphone access required');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                stopPulseEffect();
                
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                
                showState('processing');
                setTimeout(() => {
                    detectEmotion();
                }, 1500);
            }
        }

        function detectEmotion() {
            const emotions = [
                {emoji: "😊", name: "Happy", suggestion: "Keep spreading positivity! ✨"},
                {emoji: "😓", name: "Stressed", suggestion: "Take 3 deep breaths 🌿"},
                {emoji: "😢", name: "Sad", suggestion: "You're not alone 💙"},
                {emoji: "😌", name: "Calm", suggestion: "Stay in this peace 🧘"}
            ];

            const emotion = emotions[Math.floor(Math.random() * emotions.length)];
            showResult(emotion.emoji, emotion.name, emotion.suggestion);
        }

        // 🎨 UI FUNCTIONS
        function showResult(emoji, name, suggestion) {
            showState('result');
            document.getElementById('emotionEmoji').textContent = emoji;
            document.getElementById('emotionName').textContent = name;
            document.getElementById('suggestionText').textContent = suggestion;
        }

        function showError(message) {
            showState('ready');
            document.querySelector('.status-text').textContent = message;
            document.querySelector('.status-text').style.color = '#ef4444';
        }

        function resetRecorder() {
            showState('ready');
            isRecording = false;
            if (mediaRecorder) mediaRecorder = null;
            if (stream) stream.getTracks().forEach(track => track.stop());
            stopPulseEffect();
        }

        // 💾 SAVE MOOD
        function saveMood() {
            const name = document.getElementById('emotionName').textContent;
            const moods = JSON.parse(localStorage.getItem('moods') || '[]');
            
            moods.push({
                mood: name,
                date: new Date().toLocaleDateString(),
                time: new Date().toLocaleTimeString(),
                source: 'voice'
            });
            
            localStorage.setItem('moods', JSON.stringify(moods));
            
            // Success feedback
            document.querySelector('.save-btn').textContent = '✅ Saved!';
            document.querySelector('.save-btn').style.background = '#10b981';
            
            setTimeout(() => {
                window.location.href = '2.html';
            }, 1000);
        }

        // 🔴 PULSE ANIMATION
        let pulseInterval;
        function startPulseEffect() {
            const mic = document.getElementById('pulseMic');
            let pulse = 0;
            pulseInterval = setInterval(() => {
                pulse += 0.3;
                const scale = 1 + Math.sin(pulse) * 0.2;
                mic.style.transform = `scale(${scale})`;
                mic.style.filter = `drop-shadow(0 0 20px #ff6b6b80)`;
            }, 100);
        }

        function stopPulseEffect() {
            if (pulseInterval) {
                clearInterval(pulseInterval);
                document.getElementById('pulseMic').style.transform = 'scale(1)';
            }
        }

        // 🔔 ESCAPE KEY
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeVoiceRecorder();
        });
    </script>
</body>
</html>
