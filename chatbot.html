<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reflectra – Mood Space</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  height: 100vh;
  background: linear-gradient(135deg, #ffd6e8, #ffeaf2, #ffd6e8);
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  width: 100%;
  max-width: 420px;
  height: 95vh;
  background: rgba(255,255,255,0.85);
  border-radius: 25px;
  display: flex;
  flex-direction: column;
  padding: 12px;
  box-shadow: 0 20px 40px rgba(180,100,140,0.25);
}

/* header */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header {
  font-size: 20px;
  font-weight: 600;
  color: #a33a6b;
}

.new-btn {
  background: #ff8fb1;
  border: none;
  color: white;
  padding: 6px 12px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 12px;
}

/* chat */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.bot, .user {
  padding: 10px 14px;
  border-radius: 16px;
  margin-bottom: 8px;
  max-width: 75%;
  font-size: 14px;
  animation: fade 0.3s ease;
}

@keyframes fade {
  from {opacity:0; transform:translateY(5px);}
  to {opacity:1;}
}

.bot {
  background: rgba(255,255,255,0.9);
  color: #7a2f4f;
}

.user {
  background: #ffb6ce;
  color: #6a1f3a;
  margin-left: auto;
}

/* input */
.input-area {
  display: flex;
  gap: 6px;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 15px;
  border: none;
  outline: none;
}

button {
  padding: 12px;
  border-radius: 15px;
  border: none;
  background: #ff8fb1;
  color: white;
  cursor: pointer;
}

.typing {
  font-size: 12px;
  color: #a33a6b;
  padding-left: 5px;
}
</style>
</head>

<body>

<div class="card">

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="header">Reflectra 🤍</div>
    <button class="new-btn" onclick="newChat()">New Chat</button>
  </div>

  <div class="chat" id="chat"></div>
  <div id="typing" class="typing"></div>

  <div class="input-area">
    <input id="input" placeholder="Type your thoughts..." autofocus />
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const typing = document.getElementById("typing");

/* MEMORY STORAGE */
let memory = JSON.parse(localStorage.getItem("reflectraMemory")) || [];

/* LOAD OLD MESSAGES */
function loadChat() {
  if (memory.length === 0) {
    addMessage("Hey… I’m here 🤍 Tell me anything.", "bot");
  } else {
    memory.forEach(m => addMessage(m.text, m.type, false));
  }
}

/* SAVE MESSAGE */
function saveMessage(text, type) {
  memory.push({text, type});
  localStorage.setItem("reflectraMemory", JSON.stringify(memory));
}

/* ADD MESSAGE */
function addMessage(text, type, save=true) {
  const msg = document.createElement("div");
  msg.className = type;
  msg.innerText = text;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;

  if (save) saveMessage(text, type);
}

/* NEW CHAT FUNCTION */
function newChat() {
  chat.innerHTML = "";              // clear UI
  memory = [];                     // clear memory
  localStorage.removeItem("reflectraMemory");
  lastReplies = [];                // reset repetition control

  addMessage("Hey… I’m here 🤍 What’s on your mind?", "bot");
}

/* SMART REPLY */
let lastReplies = [];

function generateReply(userText) {
  const text = userText.toLowerCase();

  const isQuestion = text.includes("what") || text.includes("how") || text.includes("should");
  const isAdviceRequest = text.includes("advice") || text.includes("help") || text.includes("what should i do");

  if (text.includes("sad")) {
    return pickReply([
      "That sounds really tough 🤍 What part is bothering you most?",
      "I get it… do you want to fix it or just talk it out?",
      "Hey… I’m here. What’s making it feel this heavy?"
    ]);
  }

  if (text.includes("project") || text.includes("not working")) {
    return pickReply([
      "Let’s fix it step by step 💡\nWhat exactly isn’t working?",
      "Break it into small parts and debug one by one.\nWhere are you stuck?",
      "Tell me the exact problem — I’ll help you solve it 💻"
    ]);
  }

  if (isAdviceRequest || isQuestion) {
    return pickReply([
      "Start with the smallest problem first 👇\nFix one thing at a time.",
      "Pause → identify issue → fix step by step.\nWhat’s confusing you?",
      "Explain your problem simply — I’ll guide you 💡"
    ]);
  }

  return pickReply([
    "Tell me more… I’m listening 🤍",
    "Go on… what’s happening?",
    "I’m here for you 💭"
  ]);
}

/* PREVENT REPETITION */
function pickReply(options) {
  let filtered = options.filter(r => !lastReplies.includes(r));

  if (filtered.length === 0) {
    lastReplies = [];
    filtered = options;
  }

  const reply = filtered[Math.floor(Math.random() * filtered.length)];
  lastReplies.push(reply);

  if (lastReplies.length > 5) lastReplies.shift();

  return reply;
}

/* SEND */
function send() {
  if (input.value.trim() === "") return;

  const userText = input.value;
  addMessage(userText, "user");

  input.value = "";
  typing.innerText = "typing...";

  setTimeout(() => {
    typing.innerText = "";
    const reply = generateReply(userText);
    addMessage(reply, "bot");
  }, 700);
}

/* ENTER KEY */
input.addEventListener("keypress", function(e) {
  if (e.key === "Enter") send();
});

/* INIT */
loadChat();
</script>

</body>
</html>
