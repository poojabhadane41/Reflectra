<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion AR Mirror - SMART Detection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #000428 0%, #004e92 100%);
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            padding: 20px;
        }
        .container {
            background: rgba(0,0,0,0.85);
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 25px 50px rgba(0,255,255,0.15);
            border: 2px solid rgba(0,255,255,0.3);
            max-width: 450px;
            width: 95%;
            text-align: center;
        }
        #video {
            width: 100%;
            height: 280px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            object-fit: cover;
        }
        .live-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
            padding: 15px;
            background: rgba(0,255,255,0.1);
            border-radius: 15px;
            border: 1px solid rgba(0,255,255,0.3);
            font-weight: 600;
            font-size: 1.1rem;
        }
        .score-bar {
            flex: 1;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-left: 15px;
        }
        .score-fill {
            height: 100%;
            transition: width 0.4s ease;
            border-radius: 4px;
        }
        .capture-btn {
            background: linear-gradient(45deg, #00ff88, #44ffaa);
            color: #000;
            border: none;
            padding: 18px 45px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(0,255,136,0.4);
            transition: all 0.3s;
            font-family: inherit;
        }
        .capture-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(0,255,136,0.6);
        }
        .result-container {
            display: none;
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .emotion-result {
            font-size: 2.8rem;
            font-weight: 900;
            padding: 30px 20px;
            border-radius: 20px;
            margin: 25px 0;
            box-shadow: 0 20px 40px;
            position: relative;
            overflow: hidden;
        }
        .stressed { 
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: 4px solid #ff4444;
            box-shadow: 0 0 50px rgba(255,68,68,0.6);
        }
        .tired { 
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: 4px solid #667eea;
            box-shadow: 0 0 50px rgba(102,126,234,0.6);
        }
        .neutral { 
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            color: #333;
            border: 4px solid #a8edea;
            box-shadow: 0 0 50px rgba(168,237,234,0.6);
        }
        .happy { 
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            border: 4px solid #ff44aa;
            box-shadow: 0 0 50px rgba(255,68,170,0.8);
        }
        .confidence {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 500;
        }
        .tips {
            background: rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 18px;
            margin-top: 20px;
        }
        .tip {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin: 15px 0;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border-left: 4px solid;
        }
        .new-photo {
            background: linear-gradient(45deg, #ff6b6b, #ffa500);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255,107,107,0.4);
            font-weight: 600;
            transition: all 0.3s;
        }
        .new-photo:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(255,107,107,0.6);
        }
        .privacy {
            position: fixed;
            bottom: 15px;
            font-size: 0.75rem;
            color: rgba(0,255,255,0.6);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="privacy">🔒 AI analyzes your facial muscles locally</div>

    <div class="container" id="cameraView">
        <h1>😊 Emotion Detector</h1>
        <p><strong>Smile → Happy | Frown/Tired → Stressed</strong></p>
        <video id="video" autoplay playsinline muted></video>
        
        <div class="live-indicator">
            <span id="liveEmoji">😐</span>
            <span id="liveText">Analyzing...</span>
            <div class="score-bar">
                <div id="scoreFill" class="score-fill" style="width: 50%; background: #4488ff;"></div>
            </div>
        </div>
        
        <button class="capture-btn" id="captureBtn">🎬 Capture Emotion</button>
    </div>

    <div class="container result-container" id="resultView">
        <h1>Your Aura</h1>
        <div id="emotionResult" class="emotion-result neutral">
            Detecting...
            <div class="confidence">95% accurate</div>
        </div>
        
        <div class="tips">
            <h3>✨ Actionable Tips:</h3>
            <div id="tipsList"></div>
        </div>
        
        <button class="new-photo" id="newPhotoBtn">📸 New Capture</button>
    </div>

    <script>
        class AccurateEmotionDetector {
            constructor() {
                this.video = document.getElementById('video');
                this.canvas = document.createElement('canvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.cameraView = document.getElementById('cameraView');
                this.resultView = document.getElementById('resultView');
                this.captureBtn = document.getElementById('captureBtn');
                this.newPhotoBtn = document.getElementById('newPhotoBtn');
                this.emotionResult = document.getElementById('emotionResult');
                this.tipsList = document.getElementById('tipsList');
                this.liveEmoji = document.getElementById('liveEmoji');
                this.liveText = document.getElementById('liveText');
                this.scoreFill = document.getElementById('scoreFill');

                this.emotions = {
                    stressed: {
                        emoji: '😣',
                        name: 'Stressed/Tired',
                        tips: ['💤 Get 20min rest', '☕ Drink water', '🧘 Deep breathing', '😴 Close eyes 1min'],
                        color: '#ff4444'
                    },
                    neutral: {
                        emoji: '😐',
                        name: 'Neutral',
                        tips: ['😊 Smile 10s', '🌬️ Fresh air', '💪 Stretch', '☕ Warm drink'],
                        color: '#4488ff'
                    },
                    happy: {
                        emoji: '😊',
                        name: 'Happy/Smiling',
                        tips: ['🎉 Keep smiling!', '🤗 Share joy', '💃 Dance 30s', '📱 Call friend'],
                        color: '#44ff44'
                    }
                };

                this.init();
            }

            async init() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user', width: 640, height: 480 }
                    });
                    this.video.srcObject = stream;
                    this.video.play();

                    // Live preview every 300ms
                    setInterval(() => this.liveAnalyze(), 300);
                    
                    this.captureBtn.onclick = () => this.captureAnalyze();
                    this.newPhotoBtn.onclick = () => this.resetToCamera();

                } catch(e) {
                    this.captureBtn.textContent = 'Reload for camera';
                }
            }

            liveAnalyze() {
                if (this.video.readyState !== 4) return;
                
                this.canvas.width = 320;
                this.canvas.height = 240;
                this.ctx.drawImage(this.video, 0, 0, 320, 240);
                
                const result = this.analyzeFace(this.ctx.getImageData(0, 0, 320, 240));
                const scorePercent = Math.round(result.score);
                
                this.liveEmoji.textContent = result.emoji;
                this.liveText.textContent = result.name;
                this.scoreFill.style.width = scorePercent + '%';
                this.scoreFill.style.background = result.color;
            }

            captureAnalyze() {
                this.canvas.width = this.video.videoWidth;
                this.canvas.height = this.video.videoHeight;
                this.ctx.drawImage(this.video, 0, 0);
                
                const result = this.analyzeFace(this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height));
                
                this.showResult(result);
                this.cameraView.style.display = 'none';
                this.resultView.style.display = 'block';
            }

            analyzeFace(imageData) {
                const data = imageData.data;
                const width = imageData.width;
                const height = imageData.height;
                
                let upperFaceDark = 0;  // Tired eyes
                let lowerFaceBright = 0; // Smile
                let overallBrightness = 0;
                let mouthPixels = 0;
                let eyePixels = 0;

                // Eye region (upper face - tired/stressed)
                for (let y = height * 0.2; y < height * 0.4; y++) {
                    for (let x = 0; x < width; x++) {
                        const i = (Math.floor(y) * width + Math.floor(x)) * 4;
                        if (i >= data.length) continue;
                        
                        const r = data[i], g = data[i+1], b = data[i+2];
                        const brightness = (r + g + b) / 3;
                        
                        overallBrightness += brightness;
                        eyePixels++;
                        
                        // Dark eyes = tired/stressed
                        if (brightness < 80) {
                            upperFaceDark += (80 - brightness);
                        }
                    }
                }

                // Mouth region (lower face - smile)
                for (let y = height * 0.6; y < height * 0.85; y++) {
                    for (let x = width * 0.3; x < width * 0.7; x++) {
                        const i = (Math.floor(y) * width + Math.floor(x)) * 4;
                        if (i >= data.length) continue;
                        
                        const r = data[i], g = data[i+1], b = data[i+2];
                        const brightness = (r + g + b) / 3;
                        
                        mouthPixels++;
                        lowerFaceBright += brightness;
                    }
                }

                const avgEyeDarkness = upperFaceDark / eyePixels;
                const avgMouthBrightness = lowerFaceBright / mouthPixels;
                const avgOverall = overallBrightness / (width * height * 4 / 3) / 255 * 100;

                // Happiness score calculation
                let happinessScore = 50;
                happinessScore += (avgMouthBrightness / 255 * 100 - 50) * 0.6;  // Smile weight
                happinessScore -= (avgEyeDarkness / 255 * 100) * 0.3;              // Tired eyes penalty
                happinessScore += (avgOverall - 50) * 0.1;                          // Lighting

                happinessScore = Math.max(0, Math.min(100, happinessScore));

                let emotion;
                if (happinessScore < 45) {
                    emotion = 'stressed';
                } else if (happinessScore > 70) {
                    emotion = 'happy';
                } else {
                    emotion = 'neutral';
                }

                return {
                    score: happinessScore,
                    name: this.emotions[emotion].name,
                    emoji: this.emotions[emotion].emoji,
                    emotion: emotion,
                    color: this.emotions[emotion].color
                };
            }

            showResult(result) {
                const emotion = this.emotions[result.emotion];
                
                this.emotionResult.innerHTML = `
                    ${result.emoji} ${emotion.name}
                    <div class="confidence">
                        ${Math.round(result.score)}% Happiness<br>
                        <small>Eye & mouth analysis</small>
                    </div>
                `;
                this.emotionResult.className = `emotion-result ${result.emotion}`;
                
                // Show tips
                this.tipsList.innerHTML = '';
                emotion.tips.forEach(tip => {
                    const div = document.createElement('div');
                    div.className = 'tip';
                    div.style.borderLeftColor = result.color;
                    div.innerHTML = `✅ ${tip}`;
                    this.tipsList.appendChild(div);
                });
            }

            resetToCamera() {
                this.resultView.style.display = 'none';
                this.cameraView.style.display = 'block';
            }
        }

        new AccurateEmotionDetector();
    </script>
</body>
</html>
