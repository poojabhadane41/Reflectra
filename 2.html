<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflectra - AI Life Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --lavender: #e8d5f8;
            --sky-blue: #d1ecf1;
            --peach: #ffe4e1;
            --soft-purple: #a78bfa;
            --soft-blue: #60a5fa;
            --soft-peach: #f472b6;
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.18);
            --shadow-light: 0 8px 32px rgba(31, 38, 135, 0.1);
            --shadow-glow: 0 0 20px rgba(167, 139, 250, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--lavender) 0%, var(--sky-blue) 50%, var(--peach) 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(167,139,250,0.3) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(96,165,250,0.3) 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, rgba(244,114,182,0.2) 0%, transparent 50%);
            z-index: -1;
            animation: backgroundShift 15s ease-in-out infinite;
        }

        @keyframes backgroundShift {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 40px 0;
        }

        /* Glass Card Styles */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            padding: 32px;
            box-shadow: var(--shadow-light);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--soft-purple), var(--soft-blue), var(--soft-peach));
        }

        .glass-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-glow), 0 20px 40px rgba(0,0,0,0.1);
        }

        /* Header */
        .header {
            grid-column: 1 / -1;
            text-align: center;
            padding: 0;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--soft-purple), var(--soft-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
            font-size: 1.1rem;
            font-weight: 400;
        }

        /* Mood Overview */
        .mood-overview {
            grid-column: 1 / -1;
        }

        .mood-current {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 32px;
        }

        .mood-emoji {
            font-size: 4rem;
            animation: subtlePulse 2s ease-in-out infinite;
        }

        @keyframes subtlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .mood-text h3 {
            font-size: 2rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .mood-text p {
            color: #64748b;
            font-size: 1rem;
        }

        .weekly-trend {
            height: 100px;
            position: relative;
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            overflow: hidden;
        }

        .trend-line {
            position: absolute;
            bottom: 20px;
            left: 32px;
            right: 32px;
            height: 6px;
            background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444);
            border-radius: 3px;
            animation: trendFlow 4s ease-in-out infinite;
        }

        @keyframes trendFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Energy Tracker */
        .energy-tracker {
            text-align: center;
        }

        .energy-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: conic-gradient(#10b981 0deg 252deg, #f59e0b 252deg 324deg, #ef4444 324deg 360deg);
            margin: 0 auto 24px;
            position: relative;
            animation: rotate 10s linear infinite;
        }

        .energy-circle::before {
            content: '';
            position: absolute;
            inset: 12px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
        }

        .energy-circle::after {
            content: '78%';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e293b;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .energy-label {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .energy-subtext {
            color: #64748b;
            font-size: 0.95rem;
        }

        /* Stress Indicator */
        .stress-indicator {
            text-align: center;
        }

        .stress-meter {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            overflow: hidden;
            margin: 24px 0;
            position: relative;
        }

        .stress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981 0%, #f59e0b 50%, #ef4444 100%);
            width: 35%;
            border-radius: 6px;
            transition: width 2s ease;
            position: relative;
        }

        .stress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            right: -12px;
            width: 24px;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5));
            animation: meterShine 2s infinite;
        }

        @keyframes meterShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .stress-level {
            font-size: 1.3rem;
            font-weight: 600;
            color: #10b981;
            margin-bottom: 16px;
        }

        .stress-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(16,185,129,0.4);
        }

        .stress-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16,185,129,0.5);
        }

        /* Goals */
        .goals {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .goal-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px;
            background: rgba(255,255,255,0.15);
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .goal-item:hover {
            background: rgba(255,255,255,0.25);
            transform: translateX(8px);
        }

        .goal-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
        }

        .goal-journal { background: linear-gradient(135deg, var(--soft-purple), #8b5cf6); }
        .goal-walk { background: linear-gradient(135deg, var(--soft-blue), #3b82f6); }
        .goal-water { background: linear-gradient(135deg, var(--soft-peach), #ec4899); }

        .goal-info h4 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .goal-progress {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            overflow: hidden;
        }

        .goal-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--soft-purple), var(--soft-blue));
            border-radius: 3px;
            transition: width 1.5s ease;
        }

        /* AI Reflection */
        .ai-reflection {
            grid-column: 1 / -1;
            text-align: center;
            animation: aiGlow 3s ease-in-out infinite;
        }

        @keyframes aiGlow {
            0%, 100% { box-shadow: var(--shadow-light), 0 0 20px rgba(167,139,250,0.2); }
            50% { box-shadow: var(--shadow-light), 0 0 30px rgba(167,139,250,0.4); }
        }

        .ai-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--soft-purple), var(--soft-blue));
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            box-shadow: 0 0 30px rgba(167,139,250,0.5);
        }

        .ai-message {
            font-size: 1.2rem;
            font-weight: 500;
            color: #1e293b;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Quick Actions */
        .quick-actions {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .action-btn {
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 4px 14px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }

        .action-btn:hover::before {
            left: 100%;
        }

        .action-journal { background: linear-gradient(135deg, var(--soft-purple), #8b5cf6); color: white; }
        .action-ai { background: linear-gradient(135deg, var(--soft-blue), #3b82f6); color: white; }
        .action-calm { background: linear-gradient(135deg, #10b981, #059669); color: white; }

        .action-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        /* Weekly Insights */
        .weekly-insights {
            grid-column: 1 / -1;
        }

        .insight-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px;
            background: rgba(255,255,255,0.15);
            border-radius: 16px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }

        .insight-item:hover {
            background: rgba(255,255,255,0.25);
            transform: translateX(8px);
        }

        .insight-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--soft-peach), #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.1rem;
        }

        .insight-text h4 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .insight-text p {
            color: #64748b;
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
                gap: 24px;
                padding: 20px 0;
            }
            
            .mood-current {
                flex-direction: column;
                text-align: center;
                gap: 16px;
            }
            
            .quick-actions {
                flex-direction: row;
                flex-wrap: wrap;
            }
            
            .action-btn {
                flex: 1;
                min-width: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <div class="header">
            <h1>Reflectra</h1>
            <p>Your AI companion for mental wellness</p>
        </div>

        <!-- Mood Overview -->
        <div class="glass-card mood-overview">
            <div class="mood-current">
                <div class="mood-emoji">😌</div>
                <div class="mood-text">
                    <h3>Calm</h3>
                    <p>Today's emotional state</p>
                </div>
            </div>
            <div class="weekly-trend">
                <div class="trend-line"></div>
            </div>
            <p style="text-align: center; color: #64748b; font-size: 0.95rem; margin-top: 16px;">
                You've been feeling more relaxed than last week.
            </p>
        </div>

        <!-- Energy Tracker -->
        <div class="glass-card energy-tracker">
            <div class="energy-circle"></div>
            <div class="energy-label">Your Energy Today</div>
            <div class="energy-subtext">Moderate – Take small breaks</div>
        </div>

        <!-- Stress Indicator -->
        <div class="glass-card stress-indicator">
            <div class="stress-level">Low Stress</div>
            <div class="stress-meter">
                <div class="stress-fill"></div>
            </div>
            <button class="stress-btn">Start Stress Rescue</button>
        </div>

        <!-- Goals -->
        <div class="glass-card goals">
            <div class="goal-item" onclick="window.location.href='dash.html'">
                <div class="goal-icon goal-journal">
                    <i class="fas fa-book"></i>
                </div>
                <div class="goal-info">
                    <h4>Journaling</h4>
                    <div class="goal-progress">
                        <div class="goal-progress-fill" style="width: 60%"></div>
                    </div>
                </div>
            </div>
