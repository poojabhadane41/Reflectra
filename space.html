<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Missions Explorer 🚀</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle at top, #0b0f2a, #02030f);
  color: white;
}

/* ⭐ Stars */
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  animation: twinkle 2s infinite alternate;
}
@keyframes twinkle {
  from { opacity: 0.2; }
  to { opacity: 1; }
}

/* 🌠 Shooting stars */
.shooting {
  position: absolute;
  width: 3px;
  height: 3px;
  background: white;
  box-shadow: 0 0 10px white;
  animation: shoot 3s linear infinite;
}
@keyframes shoot {
  from {
    transform: translate(0,0);
    opacity: 1;
  }
  to {
    transform: translate(300px, 300px);
    opacity: 0;
  }
}

/* 🚀 Rocket */
.rocket {
  position: absolute;
  top: 50%;
  left: -150px;
  font-size: 110px;
  cursor: pointer;
  animation: fly 16s linear infinite, tilt 2s infinite ease-in-out;
  filter: drop-shadow(0 0 12px rgba(255,255,255,0.7));
}

@keyframes fly {
  0% { left: -150px; }
  100% { left: 110%; }
}

@keyframes tilt {
  0%,100% { transform: translateY(-50%) rotate(-5deg); }
  50% { transform: translateY(-55%) rotate(5deg); }
}

/* 🔥 Flame */
.flame {
  position: absolute;
  left: -30px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
  animation: flicker 0.2s infinite alternate;
}

@keyframes flicker {
  from { opacity: 0.6; transform: scale(1); }
  to { opacity: 1; transform: scale(1.2); }
}

/* 🌌 Popup */
.popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,20,0.9);
  display: none;
  z-index: 100;
  backdrop-filter: blur(10px);
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.popup-content {
  max-width: 600px;
  margin: 80px auto;
  text-align: center;
  padding: 20px;
  background: rgba(255,255,255,0.08);
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(255,255,255,0.1);
}

.popup img {
  width: 100%;
  border-radius: 15px;
  margin-bottom: 15px;
}

.popup h2 {
  margin-bottom: 10px;
}

.popup p {
  color: #ddd;
  line-height: 1.6;
}

.close {
  position: absolute;
  top: 20px;
  right: 25px;
  font-size: 24px;
  cursor: pointer;
}

/* 🪐 Planets */
.planet {
  position: absolute;
  border-radius: 50%;
  z-index: 0;
  animation: rotatePlanet linear infinite;
  box-shadow: inset -10px -10px 20px rgba(0,0,0,0.5),
              0 0 20px rgba(255,255,255,0.2);
}

@keyframes rotatePlanet {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* individual planets */
.planet1 {
  width: 120px;
  height: 120px;
  background: radial-gradient(circle, #ff9a9e, #fad0c4);
  top: 10%;
  left: 5%;
  animation-duration: 40s;
}

.planet2 {
  width: 80px;
  height: 80px;
  background: radial-gradient(circle, #a18cd1, #fbc2eb);
  bottom: 15%;
  right: 10%;
  animation-duration: 30s;
}

.planet3 {
  width: 60px;
  height: 60px;
  background: radial-gradient(circle, #84fab0, #8fd3f4);
  top: 60%;
  left: 20%;
  animation-duration: 25s;
}
/* 🚀 Warp stars */
.warp-star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  opacity: 0.8;
  transition: all 0.4s ease;
}

/* 💨 Warp mode */
.warp-active .warp-star {
  height: 80px;
  width: 2px;
  background: linear-gradient(white, transparent);
  animation: warpMove 0.6s linear infinite;
}

@keyframes warpMove {
  from {
    transform: translateY(0);
  }
  to {
    transform: translateY(100vh);
  }
}
</style>
</head>

<body>
  
<div class="planet planet1"></div>
<div class="planet planet2"></div>
<div class="planet planet3"></div>

<!-- 🚀 Rocket -->
<div class="rocket" id="rocket">
  🚀
  <div class="flame">🔥</div>
</div>

<!-- 🌌 Popup -->
<div class="popup" id="popup">
  <div class="close" onclick="closePopup()">✖</div>

  <div class="popup-content">
    <img id="popupImg">
    <h2 id="popupTitle"></h2>
    <p id="popupText"></p>
  </div>
</div>

<script>
const rocket = document.getElementById("rocket");
const popup = document.getElementById("popup");
const popupImg = document.getElementById("popupImg");
const popupTitle = document.getElementById("popupTitle");
const popupText = document.getElementById("popupText");

/* 🌌 SPACE DATA (SHORT + CLEAR) */
const missions = [
{
title: "SpaceX 🚀",
img: "https://cdn.arstechnica.net/wp-content/uploads/2024/10/starship_flight5_catch1.jpg",
text: "SpaceX is developing reusable rockets like Starship. Recently, it successfully caught a rocket booster using mechanical arms, making space travel faster and cheaper."
},
{
title: "Chandrayaan-3 🇮🇳",
img: "https://bsmedia.business-standard.com/_media/bs/img/article/2023-08/18/full/1692342631-0275.jpg",
text: "India’s Chandrayaan-3 made history by landing near the Moon’s south pole, proving ISRO’s advanced landing and rover technology."
},
{
title: "Mangalyaan 🌌",
img: "https://im.indiatimes.in/content/2022/Oct/1_633bcd27d92f3.jpg",
text: "Mangalyaan was India’s first Mars mission. It successfully entered Mars orbit on its first attempt, making India a leader in space exploration."
},
{
title: "Apollo Program 🌕",
img: "https://images.fineartamerica.com/images/artworkimages/mediumlarge/1/apollo-space-program-david-lee-thompson.jpg",
text: "NASA’s Apollo missions took humans to the Moon for the first time and brought them safely back to Earth."
},
{
title: "Starlink 🌐",
img: "https://tse1.mm.bing.net/th/id/OIP.SlZ4dHWmJezCEs0XenD6QQHaHa",
text: "Starlink is a network of satellites providing fast internet worldwide, especially in remote areas."
},
{
title: "Aditya-L1 ☀️",
img: "https://www.gktoday.in/wp-content/uploads/2022/01/aditya-l1-mission.png",
text: "Aditya-L1 is India’s solar mission studying the Sun to understand solar storms and space weather."
}
];

/* ⭐ stars */
/* ⭐ NORMAL + WARP STARS */
const stars = [];

for (let i = 0; i < 120; i++) {
  let star = document.createElement("div");
  star.className = "warp-star";

  star.style.top = Math.random() * 100 + "vh";
  star.style.left = Math.random() * 100 + "vw";

  document.body.appendChild(star);
  stars.push(star);
}

/* 🌠 shooting stars */
setInterval(() => {
  let s = document.createElement("div");
  s.className = "shooting";
  s.style.top = Math.random() * 50 + "vh";
  s.style.left = Math.random() * 50 + "vw";
  document.body.appendChild(s);

  setTimeout(() => s.remove(), 3000);
}, 2000);

/* 🚀 CLICK */
rocket.addEventListener("click", () => {

  // 💨 START WARP
  document.body.classList.add("warp-active");

  setTimeout(() => {
    document.body.classList.remove("warp-active");
  }, 2000);

  // 🌌 show popup (your existing code)
  const random = missions[Math.floor(Math.random() * missions.length)];

  popupImg.src = random.img;
  popupTitle.innerText = random.title;
  popupText.innerText = random.text;

  popup.style.display = "block";
});

/* ❌ CLOSE */
function closePopup() {
  popup.style.display = "none";
}
</script>

</body>
</html>
