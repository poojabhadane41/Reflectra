<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reflectra – Mood Patterns</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#ffd6e8,#ffeaf2,#ffd6e8);
  display:flex;
  justify-content:center;
  align-items:center;
}

/* floating blobs */
.blob{
  position:absolute;
  border-radius:50%;
  opacity:.25;
  animation:float 7s infinite ease-in-out;
}
.b1{width:180px;height:180px;background:#ffb3c7;top:10%;left:5%;}
.b2{width:240px;height:240px;background:#ffc1d6;bottom:12%;right:8%;animation-delay:2s;}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-18px);}
}

/* main card */
.container{
  width:92%;
  max-width:430px;
  background:linear-gradient(160deg,rgba(255,220,230,.95),rgba(255,235,240,.9));
  border-radius:32px;
  box-shadow:0 30px 60px rgba(180,100,140,.25);
  padding:20px;
  z-index:2;
}

/* header */
h1{
  text-align:center;
  color:#a33a6b;
  margin-bottom:6px;
}
.subtitle{
  text-align:center;
  color:#7a2f4f;
  font-size:14px;
  margin-bottom:16px;
}

/* weekly moods */
.week{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
  margin-bottom:22px;
}

.day{
  background:rgba(255,255,255,.6);
  border-radius:18px;
  padding:10px 0;
  text-align:center;
  font-size:22px;
  animation:pop .6s ease;
}

.day span{
  display:block;
  font-size:11px;
  margin-top:4px;
  color:#7a2f4f;
}

@keyframes pop{
  from{transform:scale(.8);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

/* monthly grid */
.month-title{
  color:#a33a6b;
  margin-bottom:10px;
  font-weight:600;
}

.month{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
}

.cell{
  background:rgba(255,255,255,.55);
  border-radius:14px;
  height:42px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:18px;
  cursor:pointer;
  transition:.25s;
}

.cell:hover{
  background:#ffd1e1;
  transform:translateY(-3px);
}

/* legend */
.legend{
  display:flex;
  justify-content:space-between;
  margin-top:16px;
  font-size:13px;
  color:#7a2f4f;
}
</style>
</head>

<body>

<div class="blob b1"></div>
<div class="blob b2"></div>

<div class="container">

<h1>Reflectra 📊</h1>
<div class="subtitle">Your emotional patterns, gently visualized</div>

<!-- Weekly Mood -->
<div class="week">
  <div class="day">😊<span>Mon</span></div>
  <div class="day">😐<span>Tue</span></div>
  <div class="day">😔<span>Wed</span></div>
  <div class="day">😊<span>Thu</span></div>
  <div class="day">😰<span>Fri</span></div>
  <div class="day">😴<span>Sat</span></div>
  <div class="day">😊<span>Sun</span></div>
</div>

<!-- Monthly Mood -->
<div class="month-title">This Month</div>
<div class="month">
  <div class="cell">😊</div>
  <div class="cell">😔</div>
  <div class="cell">😊</div>
  <div class="cell">😐</div>
  <div class="cell">😰</div>
  <div class="cell">😊</div>
  <div class="cell">😴</div>
  <div class="cell">😊</div>
  <div class="cell">😔</div>
  <div class="cell">😐</div>
  <div class="cell">😊</div>
  <div class="cell">😰</div>
  <div class="cell">😊</div>
  <div class="cell">😴</div>
</div>

<!-- Legend -->
<div class="legend">
  <div>😊 Happy</div>
  <div>😔 Sad</div>
  <div>😰 Stressed</div>
  <div>😴 Tired</div>
</div>

</div>
</body>
</html>

</body>
</html>
