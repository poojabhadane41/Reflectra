<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reflectra • Calm Ripples</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  background: radial-gradient(circle at top left, #fbd3e9, #c6ddf5);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.card {
  width: 90%;
  max-width: 420px;
  height: 85vh;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(14px);
  border-radius: 30px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.18);
  padding: 26px;
  display: flex;
  flex-direction: column;
}

h1 {
  font-size: 1.6rem;
  color: #3b2f5c;
}

p {
  margin-top: 8px;
  font-size: 0.9rem;
  color: #555;
}

.area {
  flex: 1;
  margin-top: 20px;
  border-radius: 24px;
  background: linear-gradient(160deg, #f570cd, #b84376);
  position: relative;
  overflow: hidden;
  cursor: pointer;
}

.hint {
  text-align: center;
  font-size: 0.8rem;
  color: #666;
  margin-top: 14px;
}

.back {
  margin-top: 16px;
  align-self: center;
  padding: 10px 24px;
  border-radius: 20px;
  border: none;
  background: linear-gradient(135deg, #ee66e1, #da3fec);
  color: white;
  font-size: 0.9rem;
  cursor: pointer;
}

/* Ripple */
.ripple {
  position: absolute;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.9);
  animation: ripple 1.8s ease-out forwards;
}

@keyframes ripple {
  from {
    width: 0;
    height: 0;
    opacity: 0.8;
  }
  to {
    width: 500px;
    height: 500px;
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">
  <h1>Calm Ripples</h1>
  <p>Tap anywhere. Let the tension dissolve.</p>

  <div class="area" id="area"></div>

  <div class="hint">Each ripple represents a released thought.</div>

  <button class="back" onclick="history.back()">← Back</button>
</div>

<script>
const area = document.getElementById("area");

area.addEventListener("click", (e) => {
  const ripple = document.createElement("div");
  ripple.className = "ripple";

  const rect = area.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  ripple.style.left = x + "px";
  ripple.style.top = y + "px";

  area.appendChild(ripple);

  setTimeout(() => ripple.remove(), 1800);
});
</script>

</body>
</html>

    <a href="index.html" style="background:#6a5acd;color:#fff;padding:10px 14px;border-radius:20px;text-decoration:none;font-weight:600;">Start Over</a>
  </div>
</body>
</html>
