<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Zen Garden - Meditation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            cursor: none;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        .ui {
            position: fixed; color: #fff; font-weight: 900; 
            font-size: clamp(24px, 5vw, 36px); text-shadow: 0 0 20px #fff;
            pointer-events: none; z-index: 1000; mix-blend-mode: screen;
        }
        #score { top: 5vh; left: 5vw; }
        #zen { top: 5vh; right: 5vw; font-size: clamp(18px, 3vw, 24px); }
        #menu {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: #fff; z-index: 2000;
        }
        .start-btn {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            background-size: 400% 400%; border: none; padding: 20px 60px;
            font-size: 28px; font-weight: 900; border-radius: 50px; cursor: pointer;
            color: #fff; text-shadow: 0 0 20px #fff; animation: gradientShift 3s ease infinite;
            box-shadow: 0 0 50px rgba(255,255,255,0.5);
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .sound-indicator {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: #4ecdc4; font-size: 16px; font-weight: 600; text-shadow: 0 0 10px #4ecdc4;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="ui" id="score">Zen: 0</div>
    <div class="ui" id="zen">🧘‍♀️ Breathe & Collect 🧘‍♂️</div>
    <div class="sound-indicator" id="soundIndicator" style="display: none;">🎵 Meditation Active</div>
    
    <div id="menu">
        <h1 style="font-size: clamp(48px, 12vw, 96px); margin-bottom: 30px; 
            background: linear-gradient(45deg, #ff9a9e, #fecfef); 
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">COSMIC ZEN</h1>
        <button class="start-btn" onclick="game.start()">🎵 Start Meditation</button>
    </div>

    <script>
        class CosmicZen {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                
                this.zen = 0;
                this.orbs = [];
                this.particles = [];
                this.stars = [];
                this.time = 0;
                this.mouseX = innerWidth/2;
                this.mouseY = innerHeight/2;
                this.audioCtx = null;
                this.gameRunning = false;
                
                this.init();
                this.loop();
            }
            
            init() {
                this.initStars();
                this.setupEvents();
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.startAmbient();
            }
            
            initStars() {
                for(let i=0; i<200; i++) {
                    this.stars.push({
                        x: Math.random()*innerWidth,
                        y: Math.random()*innerHeight,
                        size: Math.random()*2,
                        speed: Math.random()*0.5+0.1,
                        twinkle: Math.random()*Math.PI*2
                    });
                }
            }
            
            setupEvents() {
                addEventListener('resize', ()=>this.resize());
                addEventListener('mousemove', e=>{
                    this.mouseX = e.clientX;
                    this.mouseY = e.clientY;
                });
                addEventListener('touchmove', e=>{
                    e.preventDefault();
                    const t = e.touches[0];
                    this.mouseX = t.clientX;
                    this.mouseY = t.clientY;
                }, {passive:false});
                
                addEventListener('click', ()=>this.collect());
                addEventListener('touchstart', e=>{
                    e.preventDefault();
                    this.collect();
                }, {passive:false});
            }
            
            resize() {
                this.canvas.width = innerWidth;
                this.canvas.height = innerHeight;
            }
            
            startAmbient() {
                // Meditation Drone (432Hz - Healing Frequency)
                const drone = this.audioCtx.createOscillator();
                const droneGain = this.audioCtx.createGain();
                drone.frequency.value = 432;
                drone.type = 'sine';
                droneGain.gain.setValueAtTime(0.08, this.audioCtx.currentTime);
                drone.connect(droneGain);
                droneGain.connect(this.audioCtx.destination);
                drone.start();
                
                // Theta Binaural (6Hz difference)
                const left = this.audioCtx.createOscillator();
                const right = this.audioCtx.createOscillator();
                const merger = this.audioCtx.createChannelMerger(2);
                const binauralGain = this.audioCtx.createGain();
                left.frequency.value = 200;
                right.frequency.value = 206;
                left.type = right.type = 'sine';
                binauralGain.gain.value = 0.05;
                left.connect(merger, 0, 0);
                right.connect(merger, 0, 1);
                merger.connect(binauralGain);
                binauralGain.connect(this.audioCtx.destination);
                left.start();
                right.start();
            }
            
            playChime(frequency=800) {
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                osc.frequency.value = frequency;
                osc.type = 'triangle';
                gain.gain.setValueAtTime(0.3, this.audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.8);
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                osc.start();
                osc.stop(this.audioCtx.currentTime + 0.8);
            }
            
            collect() {
                if(!this.gameRunning) {
                    this.gameRunning = true;
                    document.getElementById('menu').style.display = 'none';
                    document.getElementById('soundIndicator').style.display = 'block';
                    return;
                }
                
                // Collect orbs
                for(let i=this.orbs.length-1; i>=0; i--) {
                    const orb = this.orbs[i];
                    const dist = Math.hypot(this.mouseX-orb.x, this.mouseY-orb.y);
                    if(dist < 100) {
                        this.zen += Math.floor(orb.size*2);
                        document.getElementById('score').textContent = `Zen: ${this.zen}`;
                        this.playChime(600 + orb.size*20);
                        
                        // Particle explosion
                        for(let j=0; j<30; j++) {
                            this.particles.push({
                                x: orb.x, y: orb.y,
                                vx: (Math.random()-0.5)*20,
                                vy: (Math.random()-0.5)*20 - 2,
                                life: 1, size: Math.random()*6+2,
                                hue: orb.hue
                            });
                        }
                        this.orbs.splice(i, 1);
                    }
                }
            }
            
            spawnOrb() {
                if(!this.gameRunning || Math.random()<0.7) return;
                this.orbs.push({
                    x: Math.random()*innerWidth,
                    y: Math.random()*innerHeight,
                    size: Math.random()*25+15,
                    hue: Math.random()*360,
                    vx: (Math.random()-0.5)*1,
                    vy: (Math.random()-0.5)*1,
                    pulse: Math.random()*Math.PI*2
                });
            }
            
            update() {
                this.time += 0.02;
                if(Math.floor(this.time*2)%3===0 && this.orbs.length<10) this.spawnOrb();
                
                // Update orbs
                this.orbs.forEach(o => {
                    o.x += o.vx; o.y += o.vy;
                    o.vx *= 0.96; o.vy *= 0.96;
                    o.pulse += 0.1;
                    if(o.x<0||o.x>innerWidth) o.vx *= -1;
                    if(o.y<0||o.y>innerHeight) o.vy *= -1;
                });
                
                // Update particles
                for(let i=this.particles.length-1; i>=0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx; p.y += p.vy;
                    p.vy += 0.2; p.vx *= 0.98; p.life *= 0.97;
                    if(p.life < 0.01) this.particles.splice(i, 1);
                }
                
                // Stars
                this.stars.forEach(s => {
                    s.y += s.speed;
                    s.twinkle += 0.1;
                    if(s.y > innerHeight) s.y = 0;
                });
            }
            
            draw() {
                // Background
                const grad = this.ctx.createRadialGradient(
                    innerWidth/2, innerHeight/2, 0,
                    innerWidth/2, innerHeight/2, Math.hypot(innerWidth, innerHeight)
                );
                grad.addColorStop(0, 'rgba(10,20,60,0.8)');
                grad.addColorStop(0.5, 'rgba(20,40,100,0.6)');
                grad.addColorStop(1, 'rgba(0,0,10,1)');
                this.ctx.fillStyle = grad;
                this.ctx.fillRect(0,0,innerWidth,innerHeight);
                
                // Stars
                this.stars.forEach(s => {
                    this.ctx.save();
                    this.ctx.globalAlpha = 0.5 + Math.sin(s.twinkle)*0.5;
                    this.ctx.fillStyle = '#fff';
                    this.ctx.beginPath();
                    this.ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                    this.ctx.fill();
                    this.ctx.restore();
                });
                
                // Orbs
                this.orbs.forEach(o => {
                    const size = o.size * (1 + Math.sin(o.pulse)*0.3);
                    const grad = this.ctx.createRadialGradient(o.x,o.y,0, o.x,o.y,size);
                    grad.addColorStop(0, `hsla(${o.hue},80%,80%,0.95)`);
                    grad.addColorStop(0.7, `hsla(${o.hue},70%,60%,0.8)`);
                    grad.addColorStop(1, `hsla(${o.hue},60%,40%,0)`);
                    
                    this.ctx.shadowColor = `hsla(${o.hue},80%,70%,0.8)`;
                    this.ctx.shadowBlur = 25;
                    this.ctx.fillStyle = grad;
                    this.ctx.beginPath();
                    this.ctx.arc(o.x, o.y, size, 0, Math.PI*2);
                    this.ctx.fill();
                    this.ctx.shadowBlur = 0;
                });
                
                // Particles
                this.particles.forEach(p => {
                    this.ctx.save();
                    this.ctx.globalAlpha = p.life;
                    this.ctx.shadowColor = `hsla(${p.hue},70%,90%,${p.life})`;
                    this.ctx.shadowBlur = 15;
                    this.ctx.fillStyle = `hsla(${p.hue},70%,90%,${p.life})`;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size*p.life, 0, Math.PI*2);
                    this.ctx.fill();
                    this.ctx.restore();
                });
                
                // Cursor glow
                if(this.gameRunning) {
                    const grad = this.ctx.createRadialGradient(this.mouseX,this.mouseY,0,this.mouseX,this.mouseY,100);
                    grad.addColorStop(0,'rgba(255,255,255,0.8)');
                    grad.addColorStop(0.6,'rgba(255,255,255,0.2)');
                    grad.addColorStop(1,'transparent');
                    this.ctx.shadowColor = '#fff';
                    this.ctx.shadowBlur = 30;
                    this.ctx.fillStyle = grad;
                    this.ctx.beginPath();
                    this.ctx.arc(this.mouseX, this.mouseY, 100, 0, Math.PI*2);
                    this.ctx.fill();
                }
            }
            
            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(()=>this.loop());
            }
            
            start() {
                this.gameRunning = true;
                document.getElementById('menu').style.display = 'none';
                document.getElementById('soundIndicator').style.display = 'block';
            }
        }
        
        const game = new CosmicZen();
    </script>
</body>
</html>
