<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflectra - Life Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8f0fe 25%, #e3f2fd 50%, #f3e5f5 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Blobs */
        .background-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            animation: float 20s ease-in-out infinite;
        }

        .blob:nth-child(1) {
            width: 400px;
            height: 400px;
            background: linear-gradient(45deg, #e1f5fe, #b3e5fc);
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .blob:nth-child(2) {
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #f3e5f5, #e1bee7);
            top: 60%;
            right: 10%;
            animation-delay: -10s;
        }

        .blob:nth-child(3) {
            width: 250px;
            height: 250px;
            background: linear-gradient(45deg, #fff3e0, #ffe0b2);
            bottom: 20%;
            left: 20%;
            animation-delay: -5s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-30px) rotate(120deg); }
            66% { transform: translateY(20px) rotate(240deg); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        /* Hero Section */
        .hero {
            position: relative;
            margin-bottom: 60px;
            padding: 60px 0;
            text-align: left;
        }

        .hero-content {
            max-width: 900px;
            margin: 0 auto 0 80px;
            position: relative;
        }

        .hero-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 400;
            background: linear-gradient(135deg, #6b48ff, #a239ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            position: relative;
        }

        .hero-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 120px;
            height: 3px;
            background: linear-gradient(90deg, #6b48ff, #a239ca);
            border-radius: 2px;
        }

        .hero-subtitle {
            font-size: 1.3rem;
            color: #64748b;
            font-weight: 300;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .mood-figure {
            position: absolute;
            right: -150px;
            top: 20px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle at 30% 30%, #a8edea 0%, #fed6e3 50%, #f8b500 100%);
            border-radius: 50%;
            animation: breathe 4s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Energy + Stress Fusion */
        .fusion-widget {
            display: flex;
            gap: 40px;
            align-items: flex-end;
            margin: 0 auto 80px;
            max-width: 800px;
            justify-content: center;
            position: relative;
        }

        .fusion-blob {
            width: 200px;
            height: 200px;
            border-radius: 50% 50% 50% 0;
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .fusion-blob:hover {
            transform: scale(1.05) translateY(-10px);
        }

        .energy-blob {
            background: linear-gradient(135deg, #a8e6cf, #88d8a3);
            box-shadow: 0 20px 40px rgba(168, 230, 207, 0.4);
        }

        .stress-blob {
            background: linear-gradient(135deg, #b8c6db, #84a0bf);
            box-shadow: 0 20px 40px rgba(184, 198, 219, 0.4);
        }

        .blob-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: 600;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .wave-connection {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 8px;
            background: linear-gradient(90deg, #a8e6cf, transparent, #b8c6db);
            border-radius: 4px;
            animation: waveFlow 3s ease-in-out infinite;
        }

        @keyframes waveFlow {
            0%, 100% { transform: translate(-50%, -50%) scaleX(1); }
            50% { transform: translate(-50%, -50%) scaleX(1.2); }
        }

        /* Life Flow Timeline */
        .timeline {
            margin: 80px 0;
            position: relative;
            max-width: 1000px;
            margin-left: 100px;
        }

        .timeline-path {
            position: relative;
            height: 120px;
            margin: 40px 0;
        }

        .timeline-river {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 20px;
            background: linear-gradient(90deg, #a8edea, #fed6e3, #f8b500, #a8edea);
            border-radius: 20px;
            transform: translateY(-50%);
            animation: riverFlow 8s ease-in-out infinite;
        }

        @keyframes riverFlow {
            0%, 100% { filter: hue-rotate(0deg) brightness(1); }
            50% { filter: hue-rotate(20deg) brightness(1.1); }
        }

        .timeline-dots {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            padding: 0 60px;
        }

        .timeline-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            font-size: 0.8rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        .timeline-dot:hover {
            transform: scale(1.4);
            box-shadow: 0 0 20px currentColor;
        }

        .timeline-dot:nth-child(1) { background: #4fc3f7; }
        .timeline-dot:nth-child(2) { background: #81c784; }
        .timeline-dot:nth-child(3) { background: #ffb74d; }
        .timeline-dot:nth-child(4) { background: #f06292; }
        .timeline-dot:nth-child(5) { background: #ba68c8; }
        .timeline-dot:nth-child(6) { background: #4db6ac; }
        .timeline-dot:nth-child(7) { background: #ff8a65; }

        /* Goals Section */
        .goals-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px 80px;
            margin: 100px 0;
            max-width: 900px;
            margin-left: auto;
            margin-right: 100px;
        }

        .goal-item {
            position: relative;
            padding: 40px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.4s ease;
            cursor: pointer;
            overflow: hidden;
        }

        .goal-item:hover {
            transform: translateY(-12px);
            box-shadow: 0 40px 80px rgba(0,0,0,0.15);
            background: rgba(255, 255, 255, 0.8);
        }

        .goal-icon {
            font-size: 2.5rem;
            margin-bottom: 20px;
            display: block;
        }

        .goal-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 12px;
        }

        .goal-progress {
            position: relative;
            height: 8px;
            background: rgba(107, 72, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin: 20px 0;
        }

        .goal-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6b48ff, #a239ca);
            border-radius: 4px;
            transition: width 2s ease;
            position: relative;
        }

        .goal-progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .goal-stats {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            color: #64748b;
        }

        /* AI Reflection Presence */
        .ai-reflection {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 320px;
            padding: 32px;
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(248,250,252,0.9));
            backdrop-filter: blur(30px);
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            animation: glowPulse 3s ease-in-out infinite;
            z-index: 1000;
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 25px 50px -12px rgba(107,72,255,0.3); }
            50% { box-shadow: 0 25px 50px -12px rgba(107,72,255,0.6), 0 0 0 8px rgba(107,72,255,0.1); }
        }

        .ai-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #6b48ff, #a239ca);
            border-radius: 50%;
            margin-bottom: 16px;
            animation: subtleFloat 3s ease-in-out infinite;
        }

        @keyframes subtleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        .ai-message {
            font-size: 1rem;
            line-height: 1.6;
            color: #334155;
            margin-bottom: 16px;
        }

        /* Quick Actions */
        .quick-actions {
            position: fixed;
            top: 50%;
            left: 40px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
        }

        .action-btn {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
        }

        .action-btn:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        }

        .action-mood { background: linear-gradient(135deg, #667eea, #764ba2); }
        .action-journal { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .action-breathe { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .action-meditate { background: linear-gradient(135deg, #43e97b, #38f9d7); }

        /* Responsive */
        @media (max-width: 1024px) {
            .fusion-widget { flex-direction: column; align-items: center; gap: 30px; }
            .timeline { margin-left: 20px; }
            .goals-section { grid-template-columns: 1fr; margin-left: 20px; margin-right: 20px; gap: 40px; }
            .hero-content { margin-left: 20px; text-align: center; }
            .mood-figure { right: 20px; }
        }

        @media (max-width: 768px) {
            .quick-actions { position: static; flex-direction: row; justify-content: center; margin: 40px 0; transform: none; }
            .ai-reflection { position: static; width: 100%; max-width: 400px; margin: 0 auto 40px; }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="background-blobs">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <div class="container">
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <h1 class="hero-title">Today feels lighter</h1>
                <p class="hero-subtitle">
                    You've been calmer today. That's growth. 
                    <br><span style="color: #6b48ff; font-weight: 500;">Keep it flowing ✨</span>
                </p>
                <div class="mood-figure"></div>
            </div>
        </section>

        <!-- Energy + Stress Fusion -->
        <div class="fusion-widget">
            <div class="fusion-blob energy-blob">
                <div class="blob-value">85%</div>
            </div>
            <div class="wave-connection"></div>
            <div class="fusion-blob stress-blob">
                <div class="blob-value">32%</div>
            </div>
        </div>

        <!-- Life Flow Timeline -->
        <section class="timeline">
            <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 2rem; text-align: center; margin-bottom: 20px; color: #475569;">Your Week's Story</h2>
            <div class="timeline-path">
                <div class="timeline-river"></div>

                    <div class="timeline-dot" title="Tue: Energetic">Tue</div>
                    <div class="timeline-dot" title="Wed: Reflective">Wed</div>
                    <div class="timeline-dot" title="Thu: Creative">Thu</div>
                    <div class="timeline-dot" title="Fri: Social">Fri</div
